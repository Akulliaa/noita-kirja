# Supabase pauses free projects after 7 days without traffic. Ping it twice a week.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            -H "apikey: sb_publishable_1s5aTBk-o4j4ev88QR0xGQ_HRGzN0I3" \
            -X POST -H "Content-Type: application/json" -d "{}" \
            "https://oqbsfukzpfhnmnnfsmdj.supabase.co/rest/v1/rpc/ping"
